events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    # ── Upload limits ──────────────────────────────────────────────────────────
    client_max_body_size 500M;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Upstreams ──────────────────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Content-Type-Options   "nosniff"           always;
        add_header X-Frame-Options          "SAMEORIGIN"        always;
        add_header X-XSS-Protection         "1; mode=block"     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

        # ── Backend API (standard JSON endpoints) ──────────────────────────────
        location /api/v1/tools/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── SSE job-status endpoint (must NOT buffer) ──────────────────────────
        location ~ ^/api/v1/jobs/.*/status$ {
            proxy_pass             http://backend;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       Connection        "";
            proxy_buffering        off;
            proxy_cache            off;
            proxy_read_timeout     86400s;  # 24 h — keep alive for long jobs
            chunked_transfer_encoding on;
        }

        # ── Download endpoint ──────────────────────────────────────────────────
        location ~ ^/api/v1/jobs/.*/download$ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }

        # ── Other backend API routes (docs, health) ────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── Frontend (Next.js) ────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}
