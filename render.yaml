services:
  # ─── FastAPI Application ───────────────────────────────────────────────────
  - type: web
    name: pdfforge-api
    env: docker
    dockerContext: ./backend
    dockerFilePath: Dockerfile.backend
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: pdfforge-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://pdfforge-frontend.vercel.app  # Replace with your Vercel URL
      - key: SECRET_KEY
        generateValue: true

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: pdfforge-worker
    env: docker
    dockerContext: ./backend
    dockerFilePath: Dockerfile.backend
    dockerCommand: celery -A services.job_queue.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: pdfforge-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: pdfforge-api
          property: secret_key

  # ─── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: pdfforge-redis
    ipAllowList: [] # Only allow internal connections
    plan: free
