envVarGroups:
  - name: pdfforge-shared
    envVars:
      - key: SECRET_KEY
        generateValue: true

services:
  # ─── FastAPI Application ───────────────────────────────────────────────────
  - type: web
    name: pdfforge-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile.backend
    plan: free
    envVars:
      - fromGroup: pdfforge-shared
      - key: REDIS_URL
        fromService:
          type: redis
          name: pdfforge-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://pd-fforge.vercel.app/  # Replace with your Vercel URL

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: pdfforge-worker
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile.backend
    dockerCommand: celery -A services.job_queue.celery_app worker --loglevel=info
    plan: free
    envVars:
      - fromGroup: pdfforge-shared
      - key: REDIS_URL
        fromService:
          type: redis
          name: pdfforge-redis
          property: connectionString

  # ─── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: pdfforge-redis
    ipAllowList: [] # Only allow internal connections
    plan: free
