envVarGroups:
  - name: docxio-shared
    envVars:
      - key: SECRET_KEY
        generateValue: true

services:
  # ─── FastAPI Application ───────────────────────────────────────────────────
  - type: web
    name: docxio-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile.backend
    plan: free
    envVars:
      - fromGroup: docxio-shared
      - key: REDIS_URL
        fromService:
          type: redis
          name: docxio-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://docxio.vercel.app,https://docxio-frontend.vercel.app

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: docxio-worker
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile.backend
    dockerCommand: celery -A services.job_queue.celery_app worker --loglevel=info --concurrency=2
    plan: free
    envVars:
      - fromGroup: docxio-shared
      - key: REDIS_URL
        fromService:
          type: redis
          name: docxio-redis
          property: connectionString

  # ─── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: docxio-redis
    ipAllowList: [] # Only allow internal connections
    plan: free
