[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfforge-backend"
version = "0.1.0"
description = "PDFForge Backend - FastAPI powered PDF tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "PyMuPDF>=1.23.21",
    "pikepdf>=8.13.0",
    "pdfplumber>=0.10.4",
    "Pillow>=10.2.0",
    "pytesseract>=0.3.10",
    "WeasyPrint>=61.1",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.22",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "aiofiles>=23.2.1"
]

[tool.ruff]
line-length = 100
target-version = "py311"
